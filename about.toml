# Inventaire des licences des dépendances liées au binaire `scripta`, joint à
# chaque archive de release (`LICENCES-DEPENDANCES.md`).
#
# Liste fermée, et toutes compatibles avec la GPLv3 : une dépendance sous une
# autre licence fait échouer `cargo about generate`. C'est voulu — la question
# doit alors être tranchée à la main, pas découverte après publication.
accepted = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

# Seul ce qui finit dans le binaire compte : les outils de build (bindgen,
# cmake) et les dépendances de test n'y entrent pas.
ignore-build-dependencies = true
ignore-dev-dependencies = true
# Les crates du workspace (`publish = false`) sont sous GPLv3, voir `LICENSE` :
# l'inventaire ne recense que du code tiers.
private = { ignore = true }

targets = [
    "x86_64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
    "aarch64-apple-darwin",
]

# whisper-rs-sys se déclare sous Unlicense — ses liaisons —, mais embarque les
# sources de whisper.cpp et ggml, sous MIT, compilées dans le binaire. Leur
# notice doit l'accompagner.
[whisper-rs-sys.clarify]
license = "MIT"

[[whisper-rs-sys.clarify.files]]
path = "whisper.cpp/LICENSE"
license = "MIT"
checksum = "e562a2ddfaf8280537795ac5ecd34e3012b6582a147ef69ba6a6a5c08c84757d"

[package]
name = "scripta-desktop"
description = "Application de bureau Scripta."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
# Nom du crate de bibliothèque : Tauri l'exige pour les cibles mobiles, et
# cela permet de tester la logique des commandes IPC sans lancer la fenêtre.
name = "scripta_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
scripta-core.workspace = true
tauri = { version = "2", features = [] }
serde.workspace = true
serde_json.workspace = true

[package]
name = "scripta-desktop"
description = "Application de bureau Scripta."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
# Distribuée en bundle, jamais sur crates.io.
publish = false

# Bibliothèque et binaire séparés : les commandes IPC se testent sans ouvrir
# de fenêtre.
[lib]
name = "scripta_desktop_lib"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
scripta-core.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"

[package]
name = "scripta-cli"
description = "Interface en ligne de commande de Scripta."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
# Distribué en binaire, jamais sur crates.io : aucune publication accidentelle.
publish = false

[[bin]]
name = "scripta"
path = "src/main.rs"

[dependencies]
scripta-core.workspace = true
clap.workspace = true
ctrlc = "3"

# ADR-001 révisé (J0) : le backend est lié à la compilation, donc un
# artefact par backend. Ces relais existent pour que la variante se demande
# au binaire qu'on construit, et non par `scripta-core/vulkan` glissé à la
# ligne de commande — qui marche, mais ne se lit nulle part.
[features]
default = []
vulkan = ["scripta-core/vulkan"]
cuda = ["scripta-core/cuda"]
metal = ["scripta-core/metal"]

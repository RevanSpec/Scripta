[package]
name = "scripta-core"
description = "Cœur applicatif de Scripta : extraction audio, inférence Whisper, formatage."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
url.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
whisper-rs = "0.16"
ureq.workspace = true
sha2.workspace = true
directories.workspace = true

# Fixture de test : sidecar simulé (yt-dlp / ffmpeg) piloté par variables
# d'environnement. Déclaré en binaire du paquet pour que `cargo test` expose
# CARGO_BIN_EXE_scripta-fake-sidecar aux tests d'intégration.
# TODO(J2) : isoler derrière une feature `test-helpers`.
[[bin]]
name = "scripta-fake-sidecar"
path = "src/bin/fake_sidecar.rs"

[features]
default = []
# ADR-001 révisé (J0) : whisper-rs-sys 0.15 lie les backends à la COMPILATION.
# Le chargement dynamique ggml n'est pas exposé : un artefact par backend.
vulkan = ["whisper-rs/vulkan"]
cuda = ["whisper-rs/cuda"]
metal = ["whisper-rs/metal"]

[dev-dependencies]
tempfile = "3"

name: Release

# Un tag `v*` construit la CLI et l'application de bureau sur les trois OS, et
# prépare un **brouillon** de release : la publication reste un geste humain,
# après relecture des notes et des artefacts. Sans tag — PR qui modifie ce
# workflow ou l'empaquetage, lancement manuel —, tout est construit, contrôlé et
# empaqueté, mais rien n'est publié : c'est la répétition générale.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "about.toml"
      - "about.hbs"
      - "docs/releases/**"
      - "scripts/sidecars/**"
      - "crates/desktop/tauri.bundle.conf.json"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: CLI ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          # 22.04 plutôt que latest : un binaire Linux exige au plus la glibc
          # de sa machine de build. Construit ici, il n'en demande que la 2.34
          # (relevée à chaque build), contre jusqu'à 2.39 sous la 24.04.
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v4

      - name: Prérequis natifs (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake libclang-dev

      # Risque R9 (docs/ROADMAP.md) : sans ces variables, --release embarque
      # sous MSVC un whisper.cpp non optimisé, quatre à six fois plus lent.
      # C'est ici plus que partout ailleurs qu'il ne faut pas l'oublier.
      #
      # Runtime C **statique**, en plus : l'« .exe autonome » du §5.4 ne doit
      # pas exiger le redistribuable Visual C++ (msvcp140.dll, vcruntime140.dll),
      # absent d'une installation neuve de Windows. /MT côté whisper.cpp et
      # +crt-static côté Rust vont ensemble : un mélange ne se lierait pas.
      # Mesuré : même transcription, débit égal ou supérieur.
      - name: Optimisation MSVC (R9) et runtime statique
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "CMAKE_C_FLAGS_RELEASE=/MT /O2 /Ob2 /DNDEBUG"   | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "CMAKE_CXX_FLAGS_RELEASE=/MT /O2 /Ob2 /DNDEBUG" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "RUSTFLAGS=-C target-feature=+crt-static"      | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      # bindgen ne trouve pas toujours libclang seul sous Windows.
      - name: LIBCLANG_PATH (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $p = "C:\Program Files\LLVM\bin"
          if (Test-Path "$p\libclang.dll") {
            "LIBCLANG_PATH=$p" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          }

      # SPEC §5.3 : macOS 11 au minimum. Sans cette variable, whisper.cpp
      # viserait la version du runner et exclurait les systèmes plus anciens.
      - name: Cible macOS
        if: runner.os == 'macOS'
        run: echo "MACOSX_DEPLOYMENT_TARGET=11.0" >> "$GITHUB_ENV"

      - name: Toolchain
        run: rustup show

      # Pas de cache : un artefact publié se construit depuis zéro, sans rien
      # hériter d'une build précédente.
      - name: Compilation
        run: cargo build --release --locked -p scripta-cli

      - name: Contrôles du binaire
        id: binaire
        shell: bash
        run: |
          exe=target/release/scripta
          [ "$RUNNER_OS" = Windows ] && exe="$exe.exe"
          "$exe" --help > /dev/null
          version=$("$exe" --version | awk '{print $2}')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "exe=$exe" >> "$GITHUB_OUTPUT"
          echo "Version compilée : $version"
          # Un tag qui ne correspond pas à la version compilée publierait un
          # binaire mal étiqueté.
          if [[ "$GITHUB_REF" == refs/tags/v* && "${GITHUB_REF#refs/tags/v}" != "$version" ]]; then
            echo "::error::Le tag ${GITHUB_REF#refs/tags/} ne correspond pas à la version compilée ($version)."
            exit 1
          fi
          # Exigences réelles du binaire, relevées plutôt que supposées : elles
          # vont dans les notes de version.
          case "$RUNNER_OS" in
            Linux) echo "glibc requise : $(objdump -T "$exe" | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1)" ;;
            macOS) echo "macOS minimal : $(otool -l "$exe" | awk '/minos/ {print $2; exit}')" ;;
            Windows)
              dll=$("/c/Program Files/LLVM/bin/llvm-objdump.exe" -p "$exe" | grep "DLL Name" | sed 's/.*DLL Name: //')
              echo "DLL importées : $(echo $dll)"
              if echo "$dll" | grep -qiE '^(msvcp|vcruntime)'; then
                echo "::error::Le binaire exige le redistribuable Visual C++ : runtime statique non appliqué."
                exit 1
              fi ;;
          esac

      - name: Outil d'inventaire des licences
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-about

      # Inventaire de la seule CLI : à la racine, cargo-about parcourrait tout
      # le workspace, application de bureau comprise, et y listerait des
      # bibliothèques absentes de l'archive — sous des licences qu'about.toml
      # n'accepte pas, ce qui ferait échouer la release.
      - name: Licences des dépendances
        run: >
          cargo about generate --locked
          --manifest-path crates/cli/Cargo.toml -c about.toml
          --target ${{ matrix.target }}
          -o LICENCES-DEPENDANCES.md about.hbs

      - name: Empaquetage
        shell: bash
        run: |
          nom="scripta-${{ steps.binaire.outputs.version }}-${{ matrix.target }}"
          mkdir -p "dist/$nom"
          cp "${{ steps.binaire.outputs.exe }}" README.md LICENSE THIRD_PARTY_LICENSES.md LICENCES-DEPENDANCES.md "dist/$nom/"
          cd dist
          if [ "$RUNNER_OS" = Windows ]; then
            7z a -tzip "$nom.zip" "$nom" > /dev/null
          else
            tar czf "$nom.tar.gz" "$nom"
          fi
          rm -r "$nom"
          ls -l

      - uses: actions/upload-artifact@v4
        with:
          name: scripta-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  # ------------------------------------------------ application de bureau ---

  # Échantillons du test de fumée de ffmpeg, produits par un ffmpeg complet —
  # celui d'Ubuntu — dans chaque forme que yt-dlp peut livrer.
  echantillons:
    name: Échantillons audio
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: ffmpeg complet
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Échantillons
        run: sh scripts/sidecars/make-samples.sh echantillons
      - uses: actions/upload-artifact@v4
        with:
          name: echantillons
          path: echantillons/
          if-no-files-found: error

  # Sidecars embarqués — SPEC §5.4, tâches 4.1 et 4.2 : yt-dlp aux versions et
  # empreintes épinglées, ffmpeg minimal compilé depuis ses sources vérifiées.
  sidecars:
    name: Sidecars ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          # Compilé depuis Linux par mingw-w64 : la chaîne MSVC ne sait pas
          # bâtir ffmpeg, et un exécutable statique mingw n'exige rien de plus
          # sur le poste.
          - os: ubuntu-22.04
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v4

      - name: mingw-w64
        if: matrix.target == 'x86_64-pc-windows-msvc'
        run: sudo apt-get update && sudo apt-get install -y mingw-w64

      - name: yt-dlp
        run: sh scripts/sidecars/fetch-ytdlp.sh ${{ matrix.target }} binaries

      # L'archive source n'est conservée qu'une fois : la LGPL impose de la
      # distribuer avec le binaire, et c'est la même pour les trois cibles.
      - name: ffmpeg
        env:
          SCRIPTA_FFMPEG_SOURCES: ${{ matrix.target == 'x86_64-unknown-linux-gnu' && format('{0}/sources', github.workspace) || '' }}
        run: sh scripts/sidecars/build-ffmpeg.sh ${{ matrix.target }} binaries

      - uses: actions/upload-artifact@v4
        with:
          name: sidecars-${{ matrix.target }}
          path: binaries/
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        with:
          name: scripta-sources-ffmpeg
          path: sources/*
          if-no-files-found: error

  bureau:
    name: Bureau ${{ matrix.target }}
    needs: [echantillons, sidecars]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: appimage,deb
          - os: macos-latest
            target: aarch64-apple-darwin
            bundles: dmg
    steps:
      - uses: actions/checkout@v4

      # WebKitGTK pour l'application, libfuse2 pour l'outil qui bâtit
      # l'AppImage, lui-même livré en AppImage.
      - name: Prérequis natifs (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libclang-dev \
            libwebkit2gtk-4.1-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev \
            libfuse2 file

      # Risque R9, comme pour la CLI. Runtime C dynamique ici : l'installeur
      # s'appuie de toute façon sur WebView2, et Tauri n'est pas éprouvé en
      # +crt-static.
      - name: Optimisation MSVC (R9)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "CMAKE_C_FLAGS_RELEASE=/MD /O2 /Ob2 /DNDEBUG"   | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "CMAKE_CXX_FLAGS_RELEASE=/MD /O2 /Ob2 /DNDEBUG" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: LIBCLANG_PATH (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $p = "C:\Program Files\LLVM\bin"
          if (Test-Path "$p\libclang.dll") {
            "LIBCLANG_PATH=$p" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          }

      - name: Cible macOS
        if: runner.os == 'macOS'
        run: echo "MACOSX_DEPLOYMENT_TARGET=11.0" >> "$GITHUB_ENV"

      - name: Toolchain
        run: rustup show

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: crates/desktop/ui/package-lock.json
      - name: Frontend
        working-directory: crates/desktop/ui
        run: npm ci

      - uses: actions/download-artifact@v4
        with:
          name: sidecars-${{ matrix.target }}
          path: crates/desktop/binaries
      - uses: actions/download-artifact@v4
        with:
          name: echantillons
          path: echantillons

      # Sur sa propre plateforme, chaque ffmpeg décode les cinq échantillons
      # par la commande même du cœur. C'est ici seulement que le binaire
      # Windows, compilé depuis Linux, s'exécute pour la première fois.
      - name: Test de fumée de ffmpeg
        shell: bash
        run: |
          # Les artefacts perdent les droits d'exécution en route.
          chmod +x crates/desktop/binaries/scripta-*
          exe=""
          [ "$RUNNER_OS" = Windows ] && exe=".exe"
          sh scripts/sidecars/smoke-ffmpeg.sh "crates/desktop/binaries/scripta-ffmpeg-${{ matrix.target }}$exe" echantillons

      - name: Outil d'inventaire des licences
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-about

      # Inventaire propre à l'application, joint au bundle avec les notices de
      # yt-dlp et de FFmpeg (tauri.bundle.conf.json).
      - name: Licences des dépendances
        run: >
          cargo about generate --locked
          --manifest-path crates/desktop/Cargo.toml -c about.toml
          --target ${{ matrix.target }}
          -o crates/desktop/LICENCES-DEPENDANCES.md about.hbs

      # PowerShell partout : sous Windows, Git Bash convertirait en chemins les
      # valeurs du contournement R9, qui commencent par `/`.
      - name: Empaquetage
        shell: pwsh
        working-directory: crates/desktop
        run: node ui/node_modules/@tauri-apps/cli/tauri.js build --ci --config tauri.bundle.conf.json --bundles ${{ matrix.bundles }}

      - name: Installeurs
        shell: bash
        run: |
          mkdir -p dist
          find target/release/bundle -maxdepth 2 -type f \
            \( -name '*.exe' -o -name '*.AppImage' -o -name '*.deb' -o -name '*.dmg' \) \
            -exec cp {} dist/ \;
          ls -l dist
          [ -n "$(ls dist)" ]

      - uses: actions/upload-artifact@v4
        with:
          name: scripta-bureau-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Brouillon de release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, bureau]
    runs-on: ubuntu-latest
    # Seul job à pouvoir écrire, et il n'emploie que des actions officielles.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # `scripta-*` : archives de la CLI, installeurs, sources de FFmpeg. Les
      # sidecars et les échantillons, intermédiaires, n'y entrent pas.
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: scripta-*
          merge-multiple: true

      - name: Sommes de contrôle
        working-directory: dist
        run: |
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Brouillon
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          notes="docs/releases/$TAG.md"
          if [ ! -f "$notes" ]; then
            echo "::error::Notes de version absentes : $notes"
            exit 1
          fi
          gh release create "$TAG" dist/* --draft --verify-tag \
            --title "Scripta $TAG" --notes-file "$notes"

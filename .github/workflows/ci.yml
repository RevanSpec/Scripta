name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  # SPEC §5.5 : aucun test de la CI de PR ne touche le réseau. YouTube est
  # instable et bloque les adresses de centres de données ; une CI qui en
  # dépendrait deviendrait rouge sans lien avec le code. La vérification des
  # extracteurs relève de la tâche planifiée quotidienne (Jalon 4, tâche 4.7).
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      # SPEC Annexe E : whisper-rs-sys compile whisper.cpp depuis les sources et
      # génère ses liaisons FFI par bindgen. CMake et libclang sont requis pour
      # BÂTIR le projet, jamais pour l'exécuter. Les runners Windows et macOS les
      # fournissent déjà ; seul Linux demande une installation.
      - name: Prérequis natifs (Linux)
        if: runner.os == 'Linux'
        # Les paquets webkit/gtk servent à Tauri : sans eux, `scripta-desktop`
        # ne compile pas, et la GUI échapperait à toute vérification.
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake libclang-dev \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            patchelf libxdo-dev

      # Contournement du risque R9 (docs/ROADMAP.md). La crate `cmake` écrase
      # CMAKE_CXX_FLAGS_<BUILD_TYPE> ; avec le générateur Visual Studio, qui
      # compile en --config Release, le profil release perd son /O2 et produit
      # un whisper.cpp 4 à 6x plus lent. Le build.rs de whisper-rs-sys
      # réinjecte toute variable CMAKE_* en define, et ces defines gagnent.
      - name: Optimisation MSVC (R9)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "CMAKE_C_FLAGS_RELEASE=/MD /O2 /Ob2 /DNDEBUG"   | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "CMAKE_CXX_FLAGS_RELEASE=/MD /O2 /Ob2 /DNDEBUG" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      # bindgen ne trouve pas toujours libclang seul sous Windows.
      - name: LIBCLANG_PATH (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $p = "C:\Program Files\LLVM\bin"
          if (Test-Path "$p\libclang.dll") {
            "LIBCLANG_PATH=$p" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            Write-Host "libclang : $p"
          } else {
            Write-Host "libclang non trouvé à l'emplacement attendu ; bindgen tentera sa propre détection."
          }

      # La version vient de rust-toolchain.toml, jamais d'ici : un `@stable`
      # ferait diverger la CI du poste de travail à chaque publication de Rust.
      - name: Toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2

      # `tauri::generate_context!` lit le frontend compilé : sans lui, le crate
      # desktop ne compile pas. `ui/dist` n'étant pas versionné, il faut le
      # bâtir ici.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: crates/desktop/ui/package-lock.json
      - name: Frontend
        working-directory: crates/desktop/ui
        run: |
          npm ci
          npm run build

      - name: Format
        run: cargo fmt --all -- --check
      # -D warnings est passé à clippy plutôt que via RUSTFLAGS : en variable
      # d'environnement il s'appliquerait aussi aux dépendances, et les liaisons
      # générées de whisper-rs-sys feraient alors échouer la CI.
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace

[workspace]
resolver = "3"
members = ["crates/core", "crates/cli", "crates/desktop"]
# `cargo build` sans `-p` ne bâtit que le cœur et la CLI : l'application de
# bureau exige WebKitGTK sous Linux et se construit par `cargo tauri`, qui
# embarque son frontend. `--workspace` (CI) ou `-p scripta-desktop` l'incluent.
default-members = ["crates/core", "crates/cli"]

[workspace.package]
version = "0.1.1"
edition = "2024"
rust-version = "1.88"
license = "GPL-3.0-or-later"
repository = "https://github.com/RevanSpec/Scripta"

[workspace.dependencies]
scripta-core = { path = "crates/core" }
url = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
ureq = "3"
sha2 = "0.11"
directories = "6"
